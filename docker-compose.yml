# Local-only orchestration. NO cloud services (AWS/Azure) are used anywhere
# in this file, per project scope decision — everything runs on localhost.
#
# Usage:
#   docker compose up --build
#
# This is set up now as a skeleton; we will actually USE it in Milestone 4
# (testing & containerization week) once the app itself is built and
# working via `uvicorn` + `npm run dev` locally.

version: "3.9"

services:
  db:
    image: postgres:16
    container_name: pricepilot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pricepilot_db
      POSTGRES_USER: pricepilot_user
      POSTGRES_PASSWORD: pricepilot_pass
    ports:
      - "5432:5432"
    volumes:
      - pricepilot_pg_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: pricepilot_backend
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: pricepilot_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pricepilot_pg_data:
